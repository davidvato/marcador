<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Marcador Deportivo - Overlay OBS</title>
  <link rel="stylesheet" href="overlay.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Contenedor principal con posicionamiento dinámico -->
  <div id="overlay-container" class="overlay-container pos-top-center">
    
    <!-- ANUNCIO / VENTANA DE TIEMPO FUERA (TIEMPO CORRIENDO) -->
    <div id="timeout-overlay-banner" class="timeout-overlay-banner hidden">
      <div class="tob-content">
        <div class="tob-icon">⏱</div>
        <div class="tob-text-group">
          <span class="tob-tag">TIEMPO FUERA</span>
          <span class="tob-team-name" id="tob-team-name">EQUIPO LOCAL</span>
        </div>
        <div class="tob-seconds-badge" id="tob-seconds">30s</div>
      </div>
    </div>

    <!-- Barra superior: Información del torneo y tiempo -->
    <div class="meta-bar">
      <div class="tournament-info">
        <span id="tournament-name" class="tournament-name">TORNEO DEPORTIVO</span>
        <span class="meta-sep">•</span>
        <span id="match-stage" class="match-stage">FASE REGULAR</span>
      </div>
      <div id="set-indicator-badge" class="set-indicator">
        SET <span id="current-set-num">1</span><span id="max-sets-container"> / <span id="max-sets-num">3</span></span>
      </div>
      <div id="timer-badge" class="timer-badge hidden">
        ⏱ <span id="timer-display">00:00</span>
      </div>
    </div>

    <!-- Barra principal del Marcador (2 Filas: Posición de Arriba y Posición Inferior) -->
    <div class="scoreboard-main stacked-scoreboard">
      
      <!-- FILA SUPERIOR (Posición de Arriba) -->
      <div class="team-row team-top" id="row-top">
        <div class="team-color-bar" id="row-top-color-bar"></div>
        <div class="team-details">
          <div class="team-name-line">
            <span class="serve-indicator" id="row-top-serve" title="En saque / posesión">🏐</span>
            <span class="team-name" id="row-top-name">EQUIPO LOCAL</span>
          </div>
          <div class="timeouts-section" id="row-top-timeouts-section">
            <span class="timeouts-label">Tiempo Fuera</span>
            <div class="timeouts-container" id="row-top-timeouts"></div>
          </div>
        </div>
        <div class="sets-won-badge" id="row-top-sets">0</div>
        <div class="score-box" id="row-top-score-box">
          <span class="score-num" id="row-top-score">0</span>
        </div>
      </div>

      <!-- SEPARADOR DE FILAS -->
      <div class="row-divider"></div>

      <!-- FILA INFERIOR (Posición Inferior) -->
      <div class="team-row team-bottom" id="row-bottom">
        <div class="team-color-bar" id="row-bottom-color-bar"></div>
        <div class="team-details">
          <div class="team-name-line">
            <span class="serve-indicator" id="row-bottom-serve" title="En saque / posesión">🏐</span>
            <span class="team-name" id="row-bottom-name">EQUIPO VISITANTE</span>
          </div>
          <div class="timeouts-section" id="row-bottom-timeouts-section">
            <span class="timeouts-label">Tiempo Fuera</span>
            <div class="timeouts-container" id="row-bottom-timeouts"></div>
          </div>
        </div>
        <div class="sets-won-badge" id="row-bottom-sets">0</div>
        <div class="score-box" id="row-bottom-score-box">
          <span class="score-num" id="row-bottom-score">0</span>
        </div>
      </div>

    </div>

    <!-- Tira de Campos Personalizados Dinámicos (Faltas, Tarjetas, Patrocinador, etc.) -->
    <div class="custom-fields-bar hidden" id="custom-fields-bar">
      <!-- Se inyectan dinámicamente según la configuración -->
    </div>

    <!-- Tira de Patrocinadores durante el Juego en Vivo -->
    <div id="game-sponsor-bar" class="game-sponsor-bar hidden">
      <span class="gsb-tag">PATROCINADOR</span>
      <div class="gsb-content">
        <img id="gsb-img" class="gsb-img hidden" src="" alt="Logo Patrocinador">
        <span id="gsb-name" class="gsb-name"></span>
      </div>
    </div>

  </div>

  <!-- VENTANA INDEPENDIENTE DE PATROCINADORES AL CENTRO DE LA PANTALLA (DURANTE TIEMPO FUERA) -->
  <div id="timeout-center-sponsor-modal" class="timeout-center-sponsor-modal hidden">
    <div class="tcsm-card">
      <div class="tcsm-header">
        <span class="tcsm-badge">⭐ PATROCINADOR OFICIAL</span>
      </div>
      <div class="tcsm-body" id="tcsm-body">
        <img id="tcsm-logo" class="tcsm-logo hidden" src="" alt="Logo Patrocinador">
        <div id="tcsm-name" class="tcsm-name"></div>
      </div>
      <div id="tcsm-dots" class="tcsm-dots"></div>
    </div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
